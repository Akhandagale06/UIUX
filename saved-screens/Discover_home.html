  <title>Discover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

:root {
  --background: #fbf7fb;
  --foreground: #221827;

  --card: #ffffff;
  --card-foreground: #221827;

  --popover: #ffffff;
  --popover-foreground: #221827;

  --primary: #b24c7c;
  --primary-rgb: 178, 76, 124;
  --primary-foreground: #ffffff;

  --secondary: #f1e6f0;
  --secondary-foreground: #221827;

  --muted: #efe2ed;
  --muted-foreground: #6b5871;

  --accent: #3aa6a6;
  --accent-foreground: #0f172a;

  --destructive: #e23a53;

  --border: #e4d6e2;
  --input: #ffffff;
  --ring: #b24c7c;

  --radius: 0.75rem;

  /* charts */
  --chart-1: #b24c7c;
  --chart-2: #3aa6a6;
  --chart-3: #f0a24f;
  --chart-4: #6a4fb3;
  --chart-5: #2f6fdf;
}

    body { background-color: var(--background); color: var(--foreground); }
  </style>
</head>

  <div class="relative w-full min-h-screen bg-[var(--background)]">
  <div class="overflow-y-auto scrollbar-none">

      </div>
    </div>

        <button class="bg-[var(--secondary)] text-[var(--foreground)] rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap hover:bg-[var(--primary)] hover:text-[var(--primary-foreground)] transition-colors">Burgers</button>
        <button class="bg-[var(--secondary)] text-[var(--foreground)] rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap hover:bg-[var(--primary)] hover:text-[var(--primary-foreground)] transition-colors">Italian</button>
        <button class="bg-[var(--secondary)] text-[var(--foreground)] rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap hover:bg-[var(--primary)] hover:text-[var(--primary-foreground)] transition-colors">Mexican</button>
        <button class="bg-[var(--secondary)] text-[var(--foreground)] rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap hover:bg-[var(--primary)] hover:text-[var(--primary-foreground)] transition-colors">Thai</button>
      </div>
    </div>

    <div class="px-4 space-y-6">
